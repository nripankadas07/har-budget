[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "har-budget"
version = "0.1.0"
description = "Groups HTTP(S) HAR requests by normalized origin, evaluates byte/request/p95 budgets and exposes unknown measurements."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Dr. Nripanka Das"}]
dependencies = []

[project.urls]
Repository = "https://github.com/nripankadas07/har-budget"
Issues = "https://github.com/nripankadas07/har-budget/issues"

[project.scripts]
har-budget = "har_budget:main"

[tool.setuptools]
py-modules = ["har_budget"]
